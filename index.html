<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <meta name="color-scheme" content="dark">

    <title>KINONEOX AI</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #050406;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding:
                env(safe-area-inset-top)
                18px
                env(safe-area-inset-bottom);

            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(181, 26, 52, 0.22),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #09070b 0%,
                    #050406 40%,
                    #030304 100%
                );
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            width: 100%;
            padding: 25px 0 20px;
            text-align: center;
        }

        .logo {
            margin: 0 0 6px;
            color: #c51d3a;
            font-size: clamp(27px, 8vw, 38px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff2a4b,
                0 0 25px #b51a34,
                0 0 45px rgba(245, 15, 60, 0.5);
        }

        .subtitle {
            margin: 0;
            color: #95909b;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-section {
            width: 100%;
            max-width: 720px;
            margin: 5px auto 30px;
        }

        .search-title {
            margin: 0 0 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 750;
            text-align: center;
        }

        .search-description {
            max-width: 540px;
            margin: 0 auto 16px;
            color: #8f8995;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 5px;
            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(23, 20, 27, 0.98),
                    rgba(10, 9, 12, 0.98)
                );

            border: 1px solid rgba(255, 42, 75, 0.55);
            border-radius: 16px;

            box-shadow:
                0 0 18px rgba(181, 26, 52, 0.18),
                0 10px 35px rgba(0, 0, 0, 0.55);
        }

        #search-input {
            flex: 1;
            min-width: 0;
            height: 48px;
            padding: 0 14px;

            color: #ffffff;
            font-size: 14px;

            background: transparent;
            border: none;
            outline: none;
        }

        #search-input::placeholder {
            color: #6f6975;
        }

        #search-input:disabled {
            color: #c7c3ca;
            cursor: wait;
        }

        #search-button {
            flex: 0 0 auto;
            min-width: 50px;
            height: 44px;
            padding: 0 15px;

            color: #ffffff;
            font-size: 18px;
            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    180deg,
                    #c51d3a,
                    #7d1023
                );

            border: 1px solid #ff3759;
            border-radius: 12px;

            box-shadow:
                0 4px 16px rgba(197, 29, 58, 0.45);

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }

        #search-button:active {
            transform: scale(0.96);
            filter: brightness(1.15);
        }

        .content-section {
            width: 100%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .section-title {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
            font-weight: 850;
            letter-spacing: 0.2px;
            text-align: center;
        }

        #home-status {
            min-height: 18px;
            margin: 0 0 18px;
            color: #908997;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }

        #movie-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 280px));
            justify-content: center;
            gap: 24px;
            width: 100%;
            min-height: 120px;
        }

        #movie-grid > article,
        #movie-grid > div {
            justify-self: center;
        }

        .features {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 720px;
            margin: 38px auto 0;
        }

        .feature {
            padding: 14px 12px;
            text-align: center;

            background: rgba(15, 13, 18, 0.85);
            border: 1px solid rgba(181, 26, 52, 0.25);
            border-radius: 14px;
        }

        .feature-icon {
            display: block;
            margin-bottom: 6px;
            font-size: 23px;
        }

        .feature-title {
            display: block;
            margin-bottom: 4px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 750;
        }

        .feature-text {
            color: #7f7985;
            font-size: 10px;
            line-height: 1.35;
        }

        .footer {
            width: 100%;
            max-width: 720px;
            margin: 38px auto 0;
            padding: 20px 10px 8px;

            color: #65606a;
            font-size: 9px;
            line-height: 1.5;
            text-align: center;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .footer a {
            color: #8c8291;
            text-decoration: none;
        }

        @media (max-width: 560px) {
            body {
                padding-right: 14px;
                padding-left: 14px;
            }

            .header {
                padding-top: 22px;
            }

            .search-section {
                margin-bottom: 26px;
            }

            #movie-grid {
                grid-template-columns: minmax(0, 300px);
                gap: 22px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 360px) {
            #search-input {
                padding-right: 8px;
                padding-left: 10px;
                font-size: 12px;
            }

            #search-button {
                min-width: 46px;
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <!-- Название приложения -->
        <header class="header">
            <h1 class="logo">KINONEOX AI 🍿</h1>

            <p class="subtitle">
                Интерактивный ИИ-Кинотеатр
            </p>
        </header>

        <!-- ИИ-поиск фильмов -->
        <section class="search-section">
            <h2 class="search-title">
                Найди фильм по любому описанию 🤖
            </h2>

            <p class="search-description">
                Напиши название фильма или опиши сюжет.
                Например: «фильм про космос, отца и путешествия во времени».
            </p>

            <div class="search-box">
                <input
                    id="search-input"
                    type="search"
                    placeholder="Название фильма или описание сюжета..."
                    autocomplete="off"
                    enterkeyhint="search"
                    maxlength="300"
                    aria-label="Поиск фильма"
                >

                <button
                    id="search-button"
                    type="button"
                    aria-label="Начать поиск"
                    title="Найти фильм"
                >
                    🔎
                </button>
            </div>
        </section>

        <!-- Динамические новинки -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title">
                    Новинки кино ✨
                </h2>
            </div>

            <div id="home-status">
                Загружаем свежие фильмы...
            </div>

            <!--
                Здесь нет статических карточек.
                Карточки фильмов автоматически добавит search.js.
            -->
            <div id="movie-grid"></div>
        </section>
