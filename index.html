<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-Кинотеатр</title>
    <style>
        body {
            background-color: #0b0b0c !important;
            color: #ffffff !important;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #e50914; font-size: 26px; margin-bottom: 5px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 25px; }
        .search-input {
            width: 100%; max-width: 360px; padding: 15px;
            background-color: #1a1a1c; border: 1px solid #2d2d30;
            border-radius: 10px; color: white; outline: none; font-size: 14px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; max-width: 360px; margin: 25px auto 0 auto;
        }
        .card {
            background-color: #141416; border: 1px solid #1f1f22;
            border-radius: 12px; padding: 15px; display: flex; flex-direction: column;
        }
        .poster { font-size: 40px; margin-bottom: 10px; }
        .title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .year { font-size: 12px; color: #6b7280; margin-bottom: 15px; }
        .btn {
            background-color: #e50914; color: white; border: none;
            padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>ИИ-КИНОТЕАТР 🍿</h1>
    <p>Смотри фильмы вместе с близкими</p>

    <input type="text" class="search-input" placeholder="🤖 Спроси ИИ: найти фильм про...">

    <div class="grid">
        <div class="card">
            <div class="poster">🎬</div>
            <div class="title">Бойцовский клуб</div>
            <div class="year">1999 • Драма</div>
            <button class="btn" onclick="alert('Комната создается...')">Создать комнату</button>
        </div>
        <div class="card">
            <div class="poster">🚀</div>
            <div class="title">Интерстеллар</div>
            <div class="year">2014 • Фантастика</div>
            <button class="btn" onclick="alert('Комната создается...')">Создать комнату</button>
        </div>
    </div>

</body>
</html>
