<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050406">

    <title>KinoNeox Premium</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #050406;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(30px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            color: #ffffff;
            background:
                radial-gradient(
                    circle at top,
                    rgba(181, 26, 52, 0.18),
                    transparent 340px
                ),
                #050406;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            margin: 20px 0 25px;
            text-align: center;
        }

        .logo {
            margin: 0 0 5px;
            color: #b51a34;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow:
                0 0 10px #ff2a4b,
                0 0 25px #b51a34,
                0 0 45px rgba(245, 15, 60, 0.5);
        }

        .subtitle {
            margin: 0;
            color: #888892;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-panel {
            width: 100%;
            margin-bottom: 18px;
            padding: 16px;

            background: rgba(12, 11, 15, 0.95);
            border: 1px solid rgba(255, 42, 75, 0.35);
            border-radius: 18px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.7),
                0 0 22px rgba(181, 26, 52, 0.16);
        }

        .search-title {
            margin: 0 0 7px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
        }

        .search-description {
            margin: 0 0 14px;
            color: #8f8796;
            font-size: 12px;
            line-height: 1.45;
            text-align: center;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        #search-input {
            width: 100%;
            min-height: 52px;
            padding: 0 48px 0 16px;

            color: #ffffff;
            background: #070609;

            border: 1px solid rgba(255, 42, 75, 0.55);
            border-radius: 14px;
            outline: none;

            font-size: 14px;

            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.01),
                0 0 15px rgba(181, 26, 52, 0.12);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #search-input::placeholder {
            color: #66616c;
        }

        #search-input:focus {
            border-color: #ff2a4b;
            box-shadow:
                0 0 0 3px rgba(255, 42, 75, 0.11),
                0 0 20px rgba(181, 26, 52, 0.2);
        }

        #search-input:disabled {
            cursor: wait;
            opacity: 0.75;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 20px;
        }

        .search-hint {
            margin: 10px 0 0;
            color: #625c68;
            font-size: 10px;
            line-height: 1.4;
            text-align: center;
        }

        .section-heading {
            width: 100%;
            margin: 5px 0 4px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 850;
            text-align: center;
        }

        #home-status {
            min-height: 18px;
            margin: 6px 0 18px;
            color: #888892;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }

        /*
         * Контейнер изначально пустой.
         * Карточки фильмов создаёт файл search.js.
         */
        #movie-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }

        .footer {
            width: 100%;
            margin-top: 28px;
            padding: 18px 10px 5px;
            color: #5f5965;
            font-size: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .noscript-message {
            width: 100%;
            padding: 16px;
            color: #ffffff;
            background: #2a1016;
            border: 1px solid #b51a34;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        @media (min-width: 700px) {
            .app {
                max-width: 960px;
            }

            .search-panel {
                max-width: 520px;
            }

            #movie-grid {
                display: grid;
                grid-template-columns:
                    repeat(auto-fit, minmax(240px, 280px));
                align-items: stretch;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="header">
            <h1 class="logo">KINONEOX AI 🍿</h1>

            <p class="subtitle">
                Интерактивный ИИ-Кинотеатр
            </p>
        </header>

        <section class="search-panel" aria-label="Поиск фильмов">
            <h2 class="search-title">
                🤖 Найди фильм с помощью ИИ
            </h2>

            <p class="search-description">
                Напиши название фильма или опиши сюжет своими словами.
            </p>

            <div class="search-wrapper">
                <input
                    id="search-input"
                    type="search"
                    inputmode="search"
                    enterkeyhint="search"
                    autocomplete="off"
                    maxlength="300"
                    aria-label="Поиск фильма"
                    placeholder="Например: фильм про сон внутри сна"
                >

                <span class="search-icon" aria-hidden="true">
                    🔎
                </span>
            </div>

            <p class="search-hint">
                Введи минимум 3 символа и нажми Enter или кнопку поиска
                на клавиатуре.
            </p>
        </section>

        <h2 class="section-heading">
            🍿 Фильмы для просмотра
        </h2>

        <div id="home-status" role="status" aria-live="polite">
            Загружаем свежие фильмы...
        </div>

        <!--
            ВАЖНО: внутри movie-grid нет старых карточек.
            Фильмы загружаются автоматически через search.js.
        -->
        <section
            id="movie-grid"
            aria-label="Список фильмов"
        ></section>

        <noscript>
            <div class="noscript-message">
                Для поиска и отображения фильмов необходимо включить
                JavaScript.
            </div>
        </noscript>

        <footer class="footer">
            KINONEOX AI · Персональный поиск фильмов
        </footer>
    </main>

    <!--
        Файл должен называться именно search.js
        и находиться рядом с index.html.
        Параметр v=3 помогает обновить кэш GitHub Pages.
    -->
    <script src="./search.js?v=6"></script>
</body>
</html>
